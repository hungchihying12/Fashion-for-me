<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#fdf8ee" />
<title>Jumino ♡ — a cosy styling diary</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<!-- ============ AUTH SCREEN ============ -->
<div id="auth-screen" class="screen">
  <div class="auth-scrap">
    <span class="sticker s1">☆</span>
    <span class="sticker s2">(✿)</span>
    <span class="sticker s3">(´-ω-`)</span>
    <div class="paper auth-card">
      <div class="donkey-holder" id="donkey-auth"></div>
      <h1 class="hand">Jumino ♡</h1>
      <p class="tagline">your tiny donkey styling diary</p>

      <div id="tabs" role="tablist">
        <button class="tab active" data-tab="login" role="tab">Log in</button>
        <button class="tab" data-tab="signup" role="tab">Sign up</button>
      </div>

      <form id="login-form" class="form" autocomplete="on">
        <input id="login-username" name="username" placeholder="Username" autocomplete="username" required />
        <input id="login-password" name="password" type="password" placeholder="Password" autocomplete="current-password" required />
        <button class="btn-mint" type="submit" id="login-submit">Log in</button>
        <p class="err" id="login-err"></p>
      </form>

      <form id="signup-form" class="form hidden" autocomplete="on">
        <input id="signup-username" name="username" placeholder="Username (3–24 letters, numbers or _)" autocomplete="username" required />
        <input id="signup-password" name="password" type="password" placeholder="Password (8+ characters)" autocomplete="new-password" required />
        <div class="upload-row">
          <label class="upload-btn">
            <input type="file" id="signup-avatar-file" accept="image/*" capture="user" />
            <span>(⌐■_■) choose or snap picture</span>
          </label>
          <label class="upload-btn">
            <input type="file" id="signup-avatar-upload" accept="image/*" />
            <span>(ﾉ◕ヮ◕)ﾉ*:･ﾟ✧ upload picture</span>
          </label>
        </div>
        <div id="signup-avatar-preview" class="avatar-preview">no picture yet</div>
        <button class="btn-mint" type="submit" id="signup-submit">Create account ♡</button>
        <p class="err" id="signup-err"></p>
      </form>
    </div>
  </div>
</div>

<!-- ============ APP SCREEN ============ -->
<div id="app-screen" class="screen hidden">
  <nav class="nav" id="nav">
    <button class="btn-mint sm" id="btn-back" title="Back">←</button>
    <button class="btn-mint sm" data-nav="home" title="Home">(⌂) Home</button>
    <div class="nav-spacer"></div>
    <button class="btn-mint sm avatar-nav" data-nav="profile" id="nav-profile" title="Profile">P</button>
    <button class="link-btn" id="btn-logout">log out</button>
  </nav>

  <main id="view"></main>

  <footer class="foot hand">made with mint &amp; marmalade ♡</footer>
</div>

<div id="toast" class="toast hidden"></div>
<div id="loading" class="loading hidden"><div class="spinner"></div><span>loading…</span></div>
<div id="modal-backdrop" class="modal-backdrop hidden" role="dialog" aria-modal="true">
  <div id="modal-content" class="modal paper"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>

<script type="module" src="js/app.js"></script>
</body>
</html>
